name: frontend
description: "BookBer - Premium Barber Booking"
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.1
  socket_io_client: ^3.1.4

  # Firebase
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.5

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # QR code generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0

dependency_overrides:
  shared_preferences_android: 2.4.26
  url_launcher_android: 6.3.32

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter_native_splash:
  color: "#000000"
  image: assets/logo.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
  - family: Satoshi
    fonts:
      - asset: assets/fonts/Satoshi-Regular.otf
      - asset: assets/fonts/Satoshi-Medium.otf
        weight: 500
      - asset: assets/fonts/Satoshi-Bold.otf
        weight: 700
  - family: Phosphor
    fonts:
      - asset: assets/fonts/Phosphor.ttf
  - family: PhosphorFill
    fonts:
      - asset: assets/fonts/Phosphor-Fill.ttf

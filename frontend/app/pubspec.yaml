name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^2.6.1

  go_router: ^13.2.0

  dio: ^5.4.1
  retrofit: ^4.1.0
  socket_io_client: ^3.1.4

  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  geolocator: ^14.0.2
  google_maps_flutter: ^2.6.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  lottie: ^3.1.0

  intl: ^0.20.2
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  permission_handler: ^12.0.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  freezed: ^2.5.2
  json_serializable: ^6.7.6

flutter:
  uses-material-design: true
  fonts:
  - family: Satoshi
    fonts:
      - asset: assets/fonts/Satoshi-Regular.otf
      - asset: assets/fonts/Satoshi-Medium.otf
        weight: 500
      - asset: assets/fonts/Satoshi-Bold.otf
        weight: 700

  - family: DM Sans
    fonts:
      - asset: assets/fonts/DMSans-Regular.ttf
      - asset: assets/fonts/DMSans-Medium.ttf
        weight: 500
      - asset: assets/fonts/DMSans-Bold.ttf
        weight: 700
